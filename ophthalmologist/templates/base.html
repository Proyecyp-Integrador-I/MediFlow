{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logo/logo_app.png" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    {% block styles %}{% endblock %}
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <div class="body-container">
        <header>
            <div class="return">
                {% block return %}{% endblock %}
            </div>

            <a href="{% url 'menu' %}">
                <div class="logo-container">
                    <div class="logo">
                        <img src="/media/logo_app.png" alt="Logo MediFlow" id="logo">
                    </div>
            
                    <div class="logo-name">
                        <p>MediFlow</p>
                    </div>
                </div>
            </a>
            
            <div class="user-container" id="userContainer">
                <div class="user-logo">
                    <p>{{ request.user.get_initial }}</p>
                </div>
                <div class="user-name">
                    <p>{{ request.user.get_full_name }}</p>
                </div>
            </div>
        </header>
    
        <main>
            {% block content %}
            {% endblock %}
        </main>

        <div class="user-dropdown" id="userDropdown">
            <ul>
                <li><a href="{% url 'logout' %}">Logout</a></li>
            </ul>
        </div>
    
        <footer>
            <div class="footer-left">
                <div class="footer-rights">
                    <p class="mb-0">All rights reserved</p>
                </div>
                <div class="footer-name">
                    <p>MediFlow ©</p>
                </div>
            </div>
            <a class="about" href="{% url 'about' %}">
                <p>About MediFlow</p>
            </a>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userContainer = document.getElementById('userContainer');
            const userDropdown = document.getElementById('userDropdown');
        
            userContainer.addEventListener('click', function(event) {
                event.stopPropagation();
                
                if (userDropdown.style.display === 'block') {
                    userDropdown.style.display = 'none';
                } else {
                    userDropdown.style.display = 'block';
                }
            });
        
            window.addEventListener('click', function(event) {
                if (!userContainer.contains(event.target)) {
                    userDropdown.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
