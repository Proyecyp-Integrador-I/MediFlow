{% extends 'base.html' %}
{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'styles/statistics.css' %}">
<link rel="stylesheet" href="{% static 'styles/back_button.css' %}">
{% endblock %}

{% block title %}Statistics{% endblock %}

{% block return %}
<a href="{% url 'menu' %}" class="back-link">
    <button class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M7 12L15 4L17.2 6.1L11.3 12L17.2 17.9L15 20L7 12Z" fill="#1C2E45" fill-opacity="0.6"/>
        </svg>
        Back
    </button>
</a>
{% endblock %}

{% block content %}
<div class="no-statistics">
    <h1>Statistics</h1>
    <h2>No statistics to show at the moment</h2>
    <h3>Please return when the exams have been analyzed</h3>
</div>

{% endblock %}
